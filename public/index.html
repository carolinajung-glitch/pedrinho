<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>fronted + backend + banco de dados</h1>
    <p>cada botão chama um método</p>


    <hr>


    <h2>listr alunos</h2>


    <button id="BtnGet">listar</button>
    <div id="Lista"></div>
    </section>


    <section>
    <h2>Post - cadastrar alunos</h2>
    <input id="cad-nome" placeholder="nome"/>
    <input id="cad-email" placeholder="email"/>
    <input id="cad-senha" placeholder="senha"/>
    <button id="btn-cadastrar">Cadastrar</button>
    </section>
<hr>


<section>
    <h2>PATCH - Atualizar cadastros</h2>
    <input id="atualizar-id" placeholder="id"/>
    <input id="atualizar-nome" placeholder="nome"/>
    <input id="atualizar-email" placeholder="email"/>
    <input id="atualizar-senha" placeholder="senha"/>
    <button id="btn-atualizar">Atualizar</button>
</section>


<section>
    <h2>DELETE - Apagar alunos</h2>
    <input id="deletar-id" placeholder="id"/>
    <button id="btn-apagar">Apagar</button>
</section>

    <script src="script.js"></script>
</body>
</html>
